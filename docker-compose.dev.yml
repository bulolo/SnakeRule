services:
  backend:
    build:
      context: ./backend/server
      dockerfile: Dockerfile.dev
    image: snakerule-server:dev
    env_file:
      - ./backend/.env
    ports:
      - "${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${SERVER_PORT:-8081}/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile.dev
    image: snakerule-admin:dev
    environment:
      API_PROXY_TARGET: http://backend:${SERVER_PORT:-8081}
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    volumes:
      - ./frontend/admin:/app
      - admin_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  docs:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${DOCS_PORT:-8003}:8003"
    volumes:
      - ./frontend/docs:/app
      - docs_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8003/docs/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    environment:
      SERVER_PORT: ${SERVER_PORT:-8081}
      NGINX_ENVSUBST_FILTER: ^SERVER_PORT$
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/snakerule.dev.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
      admin:
        condition: service_healthy
      docs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres:
    profiles: ["infra"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snakerule
      POSTGRES_USER: snakerule
      POSTGRES_PASSWORD: snakerule_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snakerule"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["infra"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  admin_node_modules:
  docs_node_modules:
  postgres_data:
  redis_data:
