services:
  backend:
    build:
      context: ./backend
      dockerfile: server/Dockerfile
    image: snakerule-server:prod
    env_file:
      - ./deploy/.env.prod
    environment:
      SERVER_ENV: production
      DATABASE_URL: postgres://snakerule:${POSTGRES_PASSWORD}@database:5432/snakerule?sslmode=disable
    tmpfs:
      - /run/pulse:mode=0750,uid=10001,gid=10001
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snakerule
      POSTGRES_USER: snakerule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env.prod}
    volumes:
      - snakerule_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snakerule -d snakerule"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    image: snakerule-admin:prod
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  docs:
    build:
      context: ./frontend/docs
      dockerfile: Dockerfile
    image: snakerule-docs:prod
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    environment:
      NGINX_ENVSUBST_FILTER: ^SERVER_PORT$
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/snakerule.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
      admin:
        condition: service_healthy
      docs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  snakerule_postgres:
