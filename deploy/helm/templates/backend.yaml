{{- if ne (int .Values.backend.replicaCount) 1 -}}
{{- fail "backend.replicaCount must remain 1 while repositories keep process-local caches" -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "snakerule.fullname" . }}-backend
  labels:
    {{- include "snakerule.labels" . | nindent 4 }}
spec:
  ports:
    - { name: http, port: {{ .Values.backend.service.port }}, targetPort: http }
  selector:
    {{- include "snakerule.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snakerule.fullname" . }}-backend
  labels:
    {{- include "snakerule.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "snakerule.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "snakerule.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/secrets: {{ include "snakerule.secretChecksum" . | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 10001
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.backend.service.port }} }
          env:
            - { name: SERVER_PORT, value: {{ .Values.backend.service.port | quote }} }
            - { name: SERVER_ENV, value: production }
            - { name: AUTH_EMAIL, value: {{ .Values.backend.env.authEmail | quote }} }
            - { name: AUTH_NAME, value: {{ .Values.backend.env.authName | quote }} }
            - { name: AUTH_SESSION_TTL, value: {{ .Values.backend.env.authSessionTTL | quote }} }
            - name: DATABASE_URL
              value: {{ printf "postgres://%s:%s@%s-database:5432/%s?sslmode=disable" .Values.database.user .Values.database.password (include "snakerule.fullname" .) .Values.database.name | quote }}
            - { name: LOG_LEVEL, value: {{ .Values.backend.env.logLevel | quote }} }
            - { name: PULSE_HEARTBEAT_URL, value: {{ .Values.backend.env.pulseHeartbeatURL | quote }} }
            - { name: PULSE_HEARTBEAT_INTERVAL_SECONDS, value: {{ .Values.backend.env.pulseHeartbeatIntervalSeconds | quote }} }
            - { name: PULSE_HEARTBEAT_TIMEOUT_SECONDS, value: {{ .Values.backend.env.pulseHeartbeatTimeoutSeconds | quote }} }
            - { name: INVOCATIONS_RETENTION_DAYS, value: {{ .Values.backend.env.invocationRetentionDays | quote }} }
            - { name: INVOCATIONS_CLEANUP_INTERVAL_SECONDS, value: {{ .Values.backend.env.invocationCleanupIntervalSeconds | quote }} }
            - { name: INVOCATIONS_CLEANUP_BATCH_SIZE, value: {{ .Values.backend.env.invocationCleanupBatchSize | quote }} }
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "snakerule.secretName" . }}, key: AUTH_PASSWORD }
            - name: LICENSE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "snakerule.secretName" . }}, key: LICENSE_ENCRYPTION_KEY }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "snakerule.secretName" . }}, key: JWT_SECRET }
            {{- if or .Values.backend.env.pulseProductPublicKey .Values.backend.env.pulseProductPublicKeyFromSecret }}
            - name: PULSE_PRODUCT_PUBLIC_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "snakerule.secretName" . }}, key: PULSE_PRODUCT_PUBLIC_KEY }
            {{- end }}
          volumeMounts:
            - { name: pulse-runtime, mountPath: /run/pulse }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: pulse-runtime
          emptyDir: {}
