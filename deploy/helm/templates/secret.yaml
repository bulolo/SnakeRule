{{- if not .Values.backend.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "snakerule.secretName" . }}
  labels:
    {{- include "snakerule.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_PASSWORD: {{ required "backend.env.authPassword must be provided" .Values.backend.env.authPassword | quote }}
  LICENSE_ENCRYPTION_KEY: {{ required "backend.env.licenseEncryptionKey must be provided and kept stable" .Values.backend.env.licenseEncryptionKey | quote }}
  JWT_SECRET: {{ required "backend.env.jwtSecret must be provided" .Values.backend.env.jwtSecret | quote }}
  POSTGRES_PASSWORD: {{ required "database.password must be provided" .Values.database.password | quote }}
  {{- if .Values.backend.env.pulseProductPublicKey }}
  PULSE_PRODUCT_PUBLIC_KEY: {{ .Values.backend.env.pulseProductPublicKey | quote }}
  {{- end }}
{{- end }}
