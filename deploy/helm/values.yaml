nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
backend:
  replicaCount: 1
  image: { repository: snakerule-server, tag: prod, pullPolicy: IfNotPresent }
  service: { port: 8081 }
  resources: {}
  existingSecret: ""
  secretChecksum: ""
  env:
    authEmail: superadmin@snakerule.cn
    authName: SuperAdmin
    authSessionTTL: 24h
    authPassword: ""
    licenseEncryptionKey: ""
    jwtSecret: ""
    pulseProductPublicKey: ""
    pulseProductPublicKeyFromSecret: false
    pulseHeartbeatURL: https://pulse.szplanner.com/api/snakerule/v1/telemetry/heartbeat
    pulseHeartbeatIntervalSeconds: "240"
    pulseHeartbeatTimeoutSeconds: "30"
    logLevel: info
database:
  image: { repository: postgres, tag: 16-alpine, pullPolicy: IfNotPresent }
  name: snakerule
  user: snakerule
  password: ""
  storage: { storageClass: "", accessModes: [ReadWriteOnce], size: 10Gi }
admin:
  replicaCount: 1
  image: { repository: snakerule-admin, tag: prod, pullPolicy: IfNotPresent }
  service: { port: 80 }
  resources: {}
nginx:
  replicaCount: 1
  image: { repository: nginx, tag: 1.27-alpine, pullPolicy: IfNotPresent }
  service: { type: LoadBalancer, port: 80, annotations: {} }
  resources: {}
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: snakerule.example.com
      paths: [{ path: /, pathType: Prefix }]
  tls: []
